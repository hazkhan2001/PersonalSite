  place: "Jerusalem"
  creator: "Francis Bedford"
  medium: Photograph
  source: public-domain
  context: |
    Francis Bedford travelled as official photographer on the Prince of
    Wales's tour of the Middle East in 1862, and photographed the Haram
    al-Sharif in Jerusalem along the way.
  note: "Sample entry: add the image and your note on it."

- id: fenton-valley-of-the-shadow
  title: "The Valley of the Shadow of Death"
  collection: war
  year: 1855
  date: "April 1855"
  place: "Near Sevastopol, Crimea"
  creator: "Roger Fenton"
  medium: Photograph
  source: public-domain
  context: |
    Taken during the Crimean War, in which the Ottoman Empire, Britain, and
    France fought Russia, this is one of the earliest famous photographs of
    war. Fenton made two exposures of the same road: one with cannonballs
    scattered across it and one with the road clear. Which came first, and
    whether the cannonballs were moved onto the road for effect, has been
    argued over ever since.
  note: "Sample entry: add the image and your note on it."
